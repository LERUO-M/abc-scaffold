name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to publish, e.g. 1.0.1 or 1.1.0"
        required: true
        type: string
      npm_tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - next
          - beta
          - alpha
      dry_run:
        description: "Dry run — run all checks without actually publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run

      - name: Set release version
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Publish dry run
        if: inputs.dry_run
        run: npm publish --access public --tag "${{ inputs.npm_tag }}" --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --tag "${{ inputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD:main --follow-tags
